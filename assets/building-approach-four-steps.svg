<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">How I approach building</title>
<desc id="desc">First, understand the user problem. Second, prioritize outcomes and align the team. Third, build, test, and ship. Fourth, measure results and learn from users. Use that evidence to update priorities and repeat.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8ba3bb"/></marker></defs>
<rect width="1200" height="340" rx="20" fill="#101923"/>
<g fill="none" stroke="#8ba3bb" stroke-width="2" marker-end="url(#arrow)">
<path d="M280 130H318"/><path d="M570 130H608"/><path d="M860 130H898"/>
<path d="M1030 215V280H450V217"/>
</g>
<g fill="#182738" stroke="#38516b" stroke-width="1.5">
<rect x="30" y="45" width="250" height="170" rx="14"/>
<rect x="320" y="45" width="250" height="170" rx="14"/>
<rect x="610" y="45" width="250" height="170" rx="14"/>
<rect x="900" y="45" width="270" height="170" rx="14" fill="#14342f" stroke="#5ab5a4"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<g fill="#79b8ff" font-size="14" font-weight="700" letter-spacing="2">
<text x="155" y="80">01</text><text x="445" y="80">02</text><text x="735" y="80">03</text>
</g>
<text x="1035" y="80" fill="#83d6c2" font-size="14" font-weight="700" letter-spacing="2">04</text>
<g fill="#f0f5fa" font-size="23" font-weight="700">
<text x="155" y="118">Understand</text><text x="445" y="118">Prioritize</text><text x="735" y="118">Build &amp; ship</text><text x="1035" y="118">Measure &amp; learn</text>
</g>
<g fill="#b9c9d8" font-size="17">
<text x="155" y="158">Find the user problem</text><text x="155" y="183">and why it matters.</text>
<text x="445" y="158">Choose the outcome.</text><text x="445" y="183">Align scope and owners.</text>
<text x="735" y="158">Design, develop, test.</text><text x="735" y="183">Put it in users' hands.</text>
<text x="1035" y="158">Review usage and feedback.</text><text x="1035" y="183">Check what improved.</text>
</g>
<rect x="500" y="262" width="480" height="36" rx="18" fill="#101923"/>
<text x="740" y="286" fill="#83d6c2" font-size="17" font-weight="600">Use the evidence to update priorities</text>
</g>
</svg>
