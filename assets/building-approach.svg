<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">How I approach building</title>
<desc id="desc">Understand the problem, align priorities and ownership, then build and validate. Refine until ready to ship. Ship and measure, then use feedback and results to revisit priorities.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8ba3bb"/></marker>
</defs>
<rect width="1000" height="380" rx="20" fill="#101923"/>
<g fill="none" stroke="#8ba3bb" stroke-width="2" marker-end="url(#arrow)">
<path d="M290 95H365"/><path d="M630 95H705"/><path d="M840 140V192"/>
<path d="M770 260H635"/>
<path d="M910 260H980V165H875V145"/>
<path d="M500 305V345H340V145H420"/>
</g>
<g fill="#182738" stroke="#38516b" stroke-width="1.5">
<rect x="30" y="50" width="260" height="90" rx="14"/>
<rect x="370" y="50" width="260" height="90" rx="14"/>
<rect x="710" y="50" width="260" height="90" rx="14"/>
<path d="M840 195L910 260L840 325L770 260Z" fill="#203348" stroke="#79b8ff"/>
<rect x="370" y="215" width="260" height="90" rx="14" fill="#14342f" stroke="#5ab5a4"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<g fill="#79b8ff" font-size="12" font-weight="700" letter-spacing="2">
<text x="160" y="77">DISCOVER</text><text x="500" y="77">DECIDE</text><text x="840" y="77">DELIVER</text>
</g>
<g fill="#f0f5fa" font-size="20" font-weight="600">
<text x="160" y="109">Understand the problem</text>
<text x="500" y="104">Align priorities</text><text x="500" y="128" font-size="16" font-weight="400">and ownership</text>
<text x="840" y="109">Build and validate</text>
<text x="840" y="255" font-size="17">Ready</text><text x="840" y="277" font-size="17">to ship?</text>
<text x="500" y="270">Ship and measure</text>
</g>
<text x="500" y="242" fill="#83d6c2" font-size="12" font-weight="700" letter-spacing="2">LEARN</text>
<g fill="#b9c9d8" font-size="14">
<text x="700" y="248">Yes</text><text x="935" y="288">Refine</text>
<text x="510" y="365">User feedback and results inform the next priorities</text>
</g>
</g>
